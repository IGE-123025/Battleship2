name: Complete CI/CD Pipeline
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  build-test-analyze:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Maven dependencies
        run: mvn dependency:resolve

      - name: Compile project
        run: mvn clean compile

      - name: Run unit tests
        run: mvn test

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
          -Dsonar.projectKey=IGE-123025_Battleship2 \
          -Dsonar.organization=ige-123025 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token=${SONAR_TOKEN}
          
  docker:
    needs: build-test-analyze

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest

  github-pages:
    needs: docker

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate Maven Site
        run: mvn clean site

      - name: Prepare Pages folder
        run: |
          rm -rf docs
          mkdir docs
          cp -r target/site* docs/

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add docs
          
          git diff --staged --quiet || \
          git commit -m "Update GitHub Pages documentation"
          
          git push

